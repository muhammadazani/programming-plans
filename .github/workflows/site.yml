# Check every code snippet on every plan card, then publish the site to GitHub Pages.
# A failing snippet stops the deploy (spec R8).
name: Check snippets and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Show toolchain versions
        run: |
          python3 --version; node --version; java -version
          rustc --version; clang --version | head -1; clang++ --version | head -1

      - name: Check the plan finder's decision tree
        run: node tools/check_finder.js

      - name: Check colour contrast (WCAG AA)
        run: python3 tools/check_contrast.py

      - name: Compile and run every snippet
        env:
          CC: clang
          CXX: clang++
        run: python3 tools/check_snippets.py -j 4

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect the public files
        run: |
          mkdir -p _site
          cp -r index.html plans assets data _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
